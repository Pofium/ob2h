[package]
name = "ob2h"
version = "1.9.2"
edition = "2021"
description = "Автономное MCP-хранилище знаний и долговременной памяти для AI-агентов на Rust"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled", "hooks", "chrono", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging", "log"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
encoding_rs = "0.8"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
bytemuck = { version = "1.21", features = ["derive"] }
flate2 = "1.0"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"] }
ignore = "0.4"
notify = "6.1"
notify-debouncer-mini = "0.4.1"
sqlite-vec = "0.1.9"
toml = "0.9"
serde_yaml_ng = "0.10"
self-replace = "1"
semver = "1"
zip = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.2"
rpassword = "7"
lru = "0.12"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }
sys-locale = { version = "0.3.2", optional = true }

[dev-dependencies]
tempfile = "3.17"

[features]
# Локальное окно ввода PIN (egui/eframe). Опционально: в headless/CI-сборках
# GUI не собирается, PIN вводится через терминал (rpassword).
gui = ["dep:eframe", "dep:sys-locale"]


