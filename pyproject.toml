[project]
name = "omnes-memory"
version = "0.1.0"
description = "Локальное MCP-хранилище знаний (память + граф + дриминг) для агента Hermes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # MCP-сервер (stdio)
    "mcp>=1.2",
    # Конфиг и схемы
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # HTTP (LLM/embedding API)
    "httpx>=0.27",
    # Вектора
    "numpy>=1.26",
]

[project.optional-dependencies]
# Локальные эмбеддинги на CPU без torch (см. ADR-4 в PLAN.md)
local = ["fastembed>=0.3"]
# Инжест документов (фаза 4)
docs = ["pypdf>=4.0", "python-docx>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
omnes-memory = "omnes_memory.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "embeds: требует установленный fastembed (skip при отсутствии)",
]
