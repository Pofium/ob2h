name: Release Builds (Cross-platform)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для сборки (tag-semver, без v)"
        required: true
        default: "1.9.10"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN_NAME: ob2h

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: Windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .zip
            # v1.9.9 (Ф72.6): окно просмотра в релизном Windows-артефакте;
            # X11/Wayland на Windows не тянутся. Linux/macOS — headless (см. PLAN.md §6).
            features: "--features gui"
          - build: Linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: .tar.gz
            features: ""
          - build: Linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: .tar.gz
            features: ""
          - build: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: .tar.gz
            features: ""
          - build: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: .tar.gz
            features: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install system deps (Linux build-essential)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build release
        uses: clechasseur/rs-cargo@v2
        with:
          command: build
          args: --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == refs/* ]]; then VERSION="${{ github.event.inputs.version }}"; fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Guard 69.1: тег должен совпадать с версией в Cargo.toml (артефакт именуется по VERSION)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            CARGO_VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
            if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
              echo "::error::Тег v$VERSION не совпадает с Cargo.toml (version = $CARGO_VERSION)"
              exit 1
            fi
          fi
          STAGE="target/stage/${BIN_NAME}-${VERSION}"
          mkdir -p "$STAGE"
          EXE=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXE=".exe"; fi
          cp -v "target/${{ matrix.target }}/release/${BIN_NAME}${EXE}" "$STAGE/"
          for d in plugin skills; do if [[ -d "$d" ]]; then cp -rv "$d" "$STAGE/"; fi; done
          for f in README.md CHANGELOG.md AGENTS.md; do if [[ -f "$f" ]]; then cp -v "$f" "$STAGE/"; fi; done

      - name: Package .tar.gz
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          OUT="target/artifacts/${BIN_NAME}-${VERSION}-${{ matrix.build }}.tar.gz"
          mkdir -p "$(dirname "$OUT")"
          tar -C "target/stage" -czf "$OUT" "${BIN_NAME}-${VERSION}"
          ls -lah "$OUT"
          echo "ARTIFACT=$OUT" >> $GITHUB_ENV

      - name: Package .zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:VERSION
          $StageRoot = "target/stage"
          $Out = "target/artifacts/${env:BIN_NAME}-${Version}-${{ matrix.build }}.zip"
          New-Item -ItemType Directory -Force -Path (Split-Path $Out -Parent) | Out-Null
          Compress-Archive -Path (Join-Path $StageRoot "${env:BIN_NAME}-${Version}") -DestinationPath $Out -Force
          Get-Item $Out | Format-List Name,Length
          "ARTIFACT=$Out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Optional Windows Authenticode signing (gated by secrets)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          SIGN_CERT_PASS: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_CERT_B64)) {
            Write-Warning "WINDOWS_SIGN_CERT_BASE64 not set — skipping Authenticode signing (ADR-29)."
          } else {
            Write-Host "Authenticode signing secret detected; signing binary..."
            $pfx = Join-Path $env:RUNNER_TEMP "ob2h-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_B64))
            $exe = "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe"
            signtool sign /f $pfx /p $env:SIGN_CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            Remove-Item $pfx -Force
          }

      - name: Optional macOS Notarization (gated by secrets)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_TEAM_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" ]]; then
            echo "::warning::Apple notarization secrets not set — skipping notarization (see Gatekeeper docs)."
          else
            echo "Apple notarization secrets detected; notarizing archive..."
            xcrun notarytool submit "${{ env.ARTIFACT }}" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          fi

      - name: SHA256 checksum + SBOM
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ env.ARTIFACT }}"
          DIR="$(dirname "$OUT")"
          NAME="$(basename "$OUT")"
          (cd "$DIR" && sha256sum "$NAME" > "$NAME.sha256" && cp "$NAME.sha256" "SHA256SUMS-${{ matrix.build }}.txt")
          SBOM="${DIR}/${BIN_NAME}-${{ env.VERSION }}-${{ matrix.build }}.sbom.json"
          cargo metadata --format-version 1 --no-deps > "$SBOM"
          echo "CHECKSUM=${OUT}.sha256" >> $GITHUB_ENV
          echo "CHECKSUM_TXT=${DIR}/SHA256SUMS-${{ matrix.build }}.txt" >> $GITHUB_ENV
          echo "SBOM=${SBOM}" >> $GITHUB_ENV
          cat "${OUT}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.CHECKSUM }}
            ${{ env.CHECKSUM_TXT }}
            ${{ env.SBOM }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ob2h ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
